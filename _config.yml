about_content: |
  I have a master's degree in Computer Software Engineering and over 14 years of experience in IT infrastructure, information security and digital product development. I am now building a hands-on technical career in **Data Science & AI** through my Weiterbildung at **WBS CODING SCHOOL**.

  I work with **Python, SQL, BigQuery, Tableau and Looker Studio**, turning raw data into clear analyses and useful applications. I particularly enjoy understanding how tables relate, identifying data-quality issues and translating findings into practical solutions. My next learning focus is **AI-assisted information extraction from documents and LLM applications**.

  Based in **Düsseldorf, Germany**. Available for a compulsory internship **31 May – 23 July 2027**, with the option of a subsequent voluntary internship.
